<h1>インストール後の設定</h1>
<ol><li>アプリケーションから「Finder Open With」を一度起動します。</li>
<li>システム設定の「ログイン項目と機能拡張」でFinder機能拡張を有効にします。設定項目の場所はmacOSのバージョンによって異なります。</li>
<li>Finderでフォルダーを右クリックし、「VS Codeで開く」を選びます。</li></ol>
<p>開発元の確認で起動が止まった場合は、配布元を確認し、「プライバシーとセキュリティ」の「このまま開く」で個別に許可してください。詳しくは同梱のINSTALL.mdを参照してください。</p>
</html>
