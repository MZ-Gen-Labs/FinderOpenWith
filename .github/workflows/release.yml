name: Release

# Pushing a tag such as v1.1.0 builds the universal installer and publishes
# (or updates) the GitHub Release for that tag with the installer attached.
# Run manually to build only; the installer is kept as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build installer
        run: ./scripts/build-installer.sh dist

      - name: Verify checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Finder Open With ${TAG#v}" --generate-notes
          fi
