<h1>Finder Open With</h1>
<p>Finderで選んだフォルダーをVS Codeで開く機能を追加します。</p>
<ul><li>macOS 13以降。Apple Silicon・Intelの両方に対応。</li>
<li>VS Codeは別途インストールしてください。</li>
<li>アプリを「アプリケーション」にインストールします。既存の同名アプリは更新されます。</li>
<li>インストールには管理者の認証が必要です。</li></ul>
<p>この個人利用向けパッケージはDeveloper ID署名・Apple公証を行っていません。</p>
